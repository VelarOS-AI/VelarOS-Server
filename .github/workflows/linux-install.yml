name: Server Linux install

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-linux-install-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Verify one isolated Server installation
        run: node scripts/linux-product.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velaros-server-linux-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: true
          path: |
            .cache/artifacts/*.tar.gz
            .cache/artifacts/*.sha256
            .cache/linux-install-proof.json
            .cache/linux-product-build.json
